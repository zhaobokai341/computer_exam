<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算🐔/姬考试</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>计算🐔/姬考试</h1>

        <div id="difficultyScreen" class="difficulty-select">
            <h2>请选择难度等级</h2>
            <div class="difficulty-buttons">
                <button class="diff-btn easy" onclick="startQuiz('easy')">简单</button>
                <button class="diff-btn medium" onclick="startQuiz('medium')">中等</button>
                <button class="diff-btn hard" onclick="startQuiz('hard')">困难</button>
                <button class="diff-btn extremly_hard" onclick="startQuiz('extremly_hard')">地狱</button>
                <br>
                <button class="btn btn-primary" onclick="window.open('https://space.bilibili.com/1458747461/search?keyword=search+computer_exam')">打开“考试”视频检索器</button>
            </div>
            <div id="loadingMsg" class="loading hidden">加载中...</div>
            <div id="errorMsg" class="error-message hidden"></div>
        </div>

        <div id="quizScreen" class="hidden">
            <div class="quiz-header">
                <span class="progress" id="progressText">第 1/10 题</span>
                <span class="score" id="scoreText">得分：0</span>
            </div>
            <div class="question-container">
                <div class="question-text" id="questionText"></div>
                <div id="multiHint" class="multi-hint hidden">（多选题，可选择多个选项）</div>
                <ul class="options-list" id="optionsList"></ul>
                <div id="fillInputContainer" class="hidden">
                    <input type="text" class="fill-input" id="fillInput" placeholder="请输入答案...">
                </div>
            </div>
            <button class="submit-btn" id="submitBtn" onclick="submitAnswer()">提交答案</button>
            <button class="next-btn hidden" id="nextBtn" onclick="nextQuestion()">下一题</button>
        </div>

        <div id="resultScreen" class="hidden">
            <div class="result-container">
                <h2>考试结束</h2>
                <div class="result-score" id="finalScore">0<span>/100</span></div>
                <div class="result-message" id="resultMessage"></div>
                <button class="restart-btn" onclick="restart()">重新开始</button>
                <div class="result-details">
                    <h3>答题详情</h3>
                    <div id="detailsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
